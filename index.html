<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChildrenStore</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
      }
      .header {
        background-color: yellow;
      }
      .header_img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }
      .navigation {
        background-color: aliceblue;
        width: 100%;
        height: 10vh;
      }
      .header_right_cart {
        background-color: white;
        width: 200px;
      }
      .header_right_cart h2 {
        margin: 0px;
      }
      .hero {
        width: 100%;
        height: 80vh;
      }
      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
     
      .footer {
        background-color: #453a3a;
        color: white;
        text-align: center;
        padding: 20px;
      }
      .gridcontainer {
        display: grid;
        grid-template-columns: repeat(1,1fr);
        gap: 20px;
        padding: 20px;
        background-color: #e5dddd;
      }
       .newarrival {
        font-size: 4rem;
        font-weight: bold;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        color: #453a3a;
      }
      .newarrival_products {
        width: 100%;
        /* background-color: #453a3a; */
        display:grid;
        grid-template-columns: repeat(3,1fr);
        gap: 20px;
      }

      .newarrival_products h3,p{
        margin: 0px;
        padding: 10px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .newarrival_products div {
        width: 100%;
        height: 300px;
       
        /* margin: 20px; */
        /* background-color: rgb(61, 42, 42); */
        color: black;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        /* justify-content: center; */
        /* padding: 4px; */
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        
      }
     
      .newarrival_products_img{
        width:100%;
        height: 60%;
        object-fit: cover;
      }
      .navigation_links {
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 50%;
        margin: 0 auto;
        
      }


     
    </style>
  </head>

  <body>
    <!-- Header section -->
    <header class="header">
      <img src="./images/childrenlogo.jpeg" class="header_img" />
      <div class="header_right">
        <input />

        <div class="header_right_cart">
          <h2>Cart</h2>
          <h2>100</h2>
        </div>
      </div>
    </header>
    <!-- Navigation section here -->
    <nav class="navigation">
      <!-- <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>

            
        </ul> -->
      <div class="navigation_links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
      </div>
    </nav>
    <!-- Hero section here -->
    <div class="hero">
      <img src="./images/herobg.jpg" />
    </div>
    <!-- New arrival -->
    <section class="gridcontainer">
      <h2 class="newarrival">New Arrivals</h2>
      <div style="width: 100%; height: 100%;">
        <div class="newarrival_products">
          <div>
            <img
              src="./images/prod1.jpg"
              class="newarrival_products_img"
            />
            <h3>Product 1</h3>
            <p>Price: $10.00</p>
          </div>
          <div>
            <img
              src="./images/prod2.jpg"
              class="newarrival_products_img"
            />
            <h3>Product 2</h3>
            <p>Price: $15.00</p>
          </div>
          <div>
            <img
              src="./images/prod3.jpg"
              class="newarrival_products_img"
            />
            <h3>Product 3</h3>
            <p>Price: $20.00</p>
          </div>
        
      </div>
    </section>
    <!-- Footer section -->
    <footer class="footer">
      <p>&copy; 2023 ChildrenStore. All rights reserved.</p>
      <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Contact Us</a>
      </div>
    </footer>
  </body>
</html>
